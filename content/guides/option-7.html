---
---
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Opret Vare - C1st Guide</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="{{ '/content/images/favicon.png' | relative_url }}"
        >
        <link rel="stylesheet" href="{{ '/content/css/style.css' | relative_url }}">
    </head>

    <body>
        <header class="site-header">
            <a href="../../index.html">← Tilbage til start</a>

            <h1>Opret Vare</h1>

            <p>Opret en ny vare i C1st.</p>
        </header>

        <main>
            <div class="guide-carousel">
                <button class="carousel-button previous">‹</button>

                <div class="carousel-content">
                    <div class="carousel-image">
                        <img
                            id="guide-image"
                            src="{{ '/content/images/option-7/step-1.png' | relative_url }}"
                            alt="Step 1"
                        >
                    </div>

                    <div class="carousel-description">
                        <div class="step-number">
                            Trin <span id="current-step">1</span>
                            af
                            <span id="total-steps">3</span>
                        </div>

                        <h2 id="guide-title">Gå til Vare</h2>

                        <p id="guide-description">Gå til Vare for at oprette en ny vare.</p>
                    </div>
                </div>

                <button class="carousel-button next">›</button>
            </div>

            <div class="carousel-dots" id="carousel-dots"></div>
        </main>

        <script>
            window.guideSteps = [
                {
                    image: "{{ '/content/images/option-7/step-1.png' | relative_url }}",
                    title: 'Gå til Vare',
                    description: 'Gå til Vare for at oprette en ny vare.',
                },
                {
                    image: "{{ '/content/images/option-7/step-2.png' | relative_url }}",
                    title: 'Lav ny vare',
                    description:
                        "Tryk på den blå 'Ny vare' for at starte oprettelsen af en ny vare.",
                },
                {
                    image: "{{ '/content/images/option-7/step-3.png' | relative_url }}",
                    title: 'Skriv vareinformation',
                    description:
                        "Indtast den nødvendige information om den nye vare. Leverandør er hvor varen er købt, mærke er varens mærke, og kategorier bruges til regnskab. Tryk til sidst på 'Opret Ny Vare' for at oprette varen.",
                },
            ];
        </script>

        <script src="{{ '/content/js/carousel.js' | relative_url }}"></script>
    </body>
</html>
