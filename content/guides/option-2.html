<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opret Sag - C1st Guide</title>

    <link rel="stylesheet" href="{{ '/content/css/style.css' | relative_url }}">
</head>

<body>

    <header class="site-header">
        <a href="../../index.html">← Tilbage til start</a>

        <h1>Opret Sag</h1>

        <p>
            Opret en ny sag i C1st.
        </p>
    </header>

    <main>

        <div class="guide-carousel">

            <button class="carousel-button previous">
                ‹
            </button>

            <div class="carousel-content">

                <div class="carousel-image">
                    <img id="guide-image"
                         src="{{ '/content/images/option-2/step-1.png' | relative_url }}"
                         alt="Step 1">
                </div>

                <div class="carousel-description">

                    <div class="step-number">
                        Trin <span id="current-step">1</span>
                        af
                        <span id="total-steps">5</span>
                    </div>

                    <h2 id="guide-title">
                        Gå til Sagstyring
                    </h2>

                    <p id="guide-description">
                        Gå til Sagstyring og opret en ny sag.
                    </p>

                </div>

            </div>

            <button class="carousel-button next">
                ›
            </button>

        </div>

        <div class="carousel-dots" id="carousel-dots"></div>

    </main>

    <script>
    const guideSteps = [
        {
            image: "{{ '/content/images/option-2/step-1.png' | relative_url }}",
            title: "Gå til Sagstyring",
            description:
                "Gå til Sagstyring og opret en ny sag."
        },
        {
            image: "{{ '/content/images/option-2/step-2.png' | relative_url }}",
            title: "Lav ny sag",
            description:
                "Tryk på den blå 'Ny sag' for at starte oprettelsen af en ny sag."
        },
        {
            image: "{{ '/content/images/option-2/step-3.png' | relative_url }}",
            title: "Skriv telefonnummer",
            description:
                "Indtast kundens telefonnummer, hvis de ikke findes, så opret dem som ny kunde."
        },
        {
            image: "{{ '/content/images/option-2/step-4.png' | relative_url }}",
            title: "Tilføj kundens enhed",
            description:
                "Tryk på 'Ny kundeenhed' og indtast det nødvendige information om kundens enhed."
        },
        {
            image: "{{ '/content/images/option-2/step-5.png' | relative_url }}",
            title: "Indtast sagsinformation",
            description:
                "Indtast de nødvendige informationer, og scan de vare som bruges i sagen."
        },
        {
            image: "{{ '/content/images/option-2/step-6.png' | relative_url }}",
            title: "Print information",
            description:
                "Print værksteds- og indleveringsseddel, og giv kunden indleveringsseddelen."
        }
    ];
    </script>

    <script src="{{ '/content/js/carousel.js' | relative_url }}"></script>

</body>
</html>
