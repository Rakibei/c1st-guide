<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Retur køb - C1st Guide</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="../images/favicon.png"
        >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header class="site-header">
            <a href="../../index.html">← Tilbage til start</a>

            <h1>Retur køb</h1>

            <p>Retur et køb i C1st.</p>
        </header>

        <main>
            <div class="guide-carousel">
                <button class="carousel-button previous">‹</button>

                <div class="carousel-content">
                    <div class="carousel-image">
                        <img
                            id="guide-image"
                            src="../images/option-1/step-1.png"
                            alt="Step 1"
                        >
                    </div>

                    <div class="carousel-description">
                        <div class="step-number">
                            Trin <span id="current-step">1</span>
                            af
                            <span id="total-steps">3</span>
                        </div>

                        <h2 id="guide-title">Gå til Vare</h2>

                        <p id="guide-description">Gå til Sagstyring og opret en ny sag.</p>
                    </div>
                </div>

                <button class="carousel-button next">›</button>
            </div>

            <div class="carousel-dots" id="carousel-dots"></div>
        </main>

        <script>
            window.guideSteps = [
                {
                    image: "../images/option-1/step-1.png",
                    title: 'Gå til Kasse',
                    description: '',
                },
                {
                    image: "../images/option-4/step-2.png",
                    title: 'Gå til Salgshistorik',
                    description: "Tryk på 'Salgshistorik' for at gå til salgshistorikken.",
                },
                {
                    image: "../images/option-4/step-3.png",
                    title: 'Søg efter salg',
                    description:
                        'Søg efter det bøn-nr på salget, som skal returneres, og klik på salget.',
                },
                {
                    image: "../images/placeholder.png",
                    title: 'Vælg vare',
                    description: "Vælg de vare, som skal returneres, og klik på 'Retur'.",
                },
                {
                    image: "../images/placeholder.png",
                    title: 'Tjek vare',
                    description:
                        "Dobbelttjek for at sikre, at alt er korrekt. Derefter tryk på 'Retur'.",
                },
                {
                    image: "../images/option-4/step-6.png",
                    title: 'Vælg betalingsmetode',
                    description:
                        'Vælg den betalingsmetode, hvor kunden vil have pengene returneret.',
                },
            ];
        </script>

        <script src="../js/carousel.js"></script>
    </body>
</html>
