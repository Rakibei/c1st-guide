<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Lav Salg - C1st Guide</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="../images/favicon.png"
        >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header class="site-header">
            <a href="../../Start Guide.html">← Tilbage til start</a>

            <!--Change <h1> and <p>-->
            <h1>Lav Salg</h1>

            <p>Lav et salg i C1st.</p>
        </header>

        <main>
            <div class="guide-carousel">
                <button class="carousel-button previous">‹</button>

                <div class="carousel-content">
                    <div class="carousel-image">
                        <img id="guide-image"
                             src=""
                             alt="">
                    </div>

                    <div class="carousel-description">
                        <div class="step-number">
                            Trin <span id="current-step">1</span>
                            af
                            <span id="total-steps">3</span>
                        </div>

                        <h2 id="guide-title">Gå til Kasse</h2>

                        <p id="guide-description">
                            Gå til Kasse og scan/vælg den vare, som kunden vil købe.
                        </p>
                    </div>
                </div>

                <button class="carousel-button next">›</button>
            </div>

            <div class="carousel-dots" id="carousel-dots"></div>
        </main>

        <!--Only change the guideSteps array to modify the guide steps-->
        <script>
            window.guideSteps = [
                {
                    image: "../images/lavSalg/step-1.png",
                    title: 'Gå til Kasse',
                    description: 'Gå til Kasse og scan/vælg den vare, som kunden vil købe.',
                },
                {
                    image: "../images/lavSalg/step-2.png",
                    title: 'Tjek kassen',
                    description:
                        "Når alle vare er tilføjet, dobbelttjek for at sikre, at alt er korrekt. Derefter tryk på 'Betal'.",
                },
                {
                    image: "../images/lavSalg/step-3.png",
                    title: 'Vælg betalingsmetode',
                    description:
                        'Vælg den betalingsmetode, som kunden vil bruge for at afslutte salget. Du kan udskrive en kvittering efter salget er afsluttet.',
                },
            ];
        </script>

        <script src="../js/carousel.js"></script>
    </body>
</html>
