<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Option 1 - Setup Guide</title>

    <link rel="stylesheet" href="{{ '/content/css/style.css' | relative_url }}">
</head>

<body>

    <header class="site-header">
        <a href="../../index.html">← Tilbage til start</a>

        <h1>Salg</h1>

        <p>
            Lav et salg i C1st.
        </p>
    </header>

    <main>

        <div class="guide-carousel">

            <button class="carousel-button previous">
                ‹
            </button>

            <div class="carousel-content">

                <div class="carousel-image">
                    <img id="guide-image"
                         src="{{ '/content/images/option-1/step-1.png' | relative_url }}"
                         alt="Step 1">
                </div>

                <div class="carousel-description">

                    <div class="step-number">
                        Step <span id="current-step">1</span>
                        of
                        <span id="total-steps">3</span>
                    </div>

                    <h2 id="guide-title">
                        Gå til kassen
                    </h2>

                    <p id="guide-description">
                        Gå til kassen og scan/vælg den vare, som kunden vil købe.
                    </p>

                </div>

            </div>

            <button class="carousel-button next">
                ›
            </button>

        </div>

        <div class="carousel-dots" id="carousel-dots"></div>

    </main>

    <script>
    const guideSteps = [
        {
            image: "{{ '/content/images/option-1/step-1.png' | relative_url }}",
            title: "Gå til kassen",
            description:
                "Gå til kassen og scan/vælg den vare, som kunden vil købe."
        },
        {
            image: "{{ '/content/images/option-1/step-2.png' | relative_url }}",
            title: "Tjek kassen",
            description:
                "Når alle vare er tilføjet, dobbelttjek for at sikre, at alt er korrekt. Derefter tryk på 'Betal'."
        },
        {
            image: "{{ '/content/images/option-1/step-3.png' | relative_url }}",
            title: "Vælg betalingsmetode",
            description:
                "Vælg den betalingsmetode, som kunden vil bruge for at afslutte salget. Du kan udskrive en kvittering efter salget er afsluttet."
        }
    ];
    </script>

    <script src="{{ '/content/js/carousel.js' | relative_url }}"></script>

</body>
</html>
