<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Option 1 - Setup Guide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="site-header">
    <a href="../../index.html">← Back to options</a>

    <h1>Option 1</h1>

    <p>
        Follow the steps below to complete the installation.
    </p>
</header>

<main>

    <div class="guide-carousel">

        <button class="carousel-button previous">
            ‹
        </button>

        <div class="carousel-content">

            <div class="carousel-image">
                <img
                    id="guide-image"
                    src="../images/option-1/step-1.png"
                    alt="Step 1">
            </div>

            <div class="carousel-description">

                <div class="step-number">
                    Step <span id="current-step">1</span>
                    of
                    <span id="total-steps">3</span>
                </div>

                <h2 id="guide-title">
                    Open the settings
                </h2>

                <p id="guide-description">
                    Open the application's settings menu by clicking
                    the Settings button shown in the image.
                </p>

            </div>

        </div>

        <button class="carousel-button next">
            ›
        </button>

    </div>

    <div class="carousel-dots" id="carousel-dots"></div>

</main>

<script>
    const guideSteps = [
        {
            image: "../images/option-1/step-1.png",
            title: "Open the settings",
            description:
                "Open the application's settings menu by clicking the Settings button shown in the image."
        },
        {
            image: "../images/option-1/step-2.png",
            title: "Select Plugins",
            description:
                "Once the settings window is open, select the Plugins section from the menu on the left."
        },
        {
            image: "../images/option-1/step-3.png",
            title: "Install the plugin",
            description:
                "Find the plugin in the list and click Install. Wait for the installation to finish before continuing."
        }
    ];
</script>

<script src="../js/carousel.js"></script>

</body>
</html>
