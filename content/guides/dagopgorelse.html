<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Change <title> -->
        <title>Dagopgørelse - C1st Guide</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="../images/favicon.png"
        >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header class="site-header">
            <a href="../../Start Guide.html">← Tilbage til start</a>

            <!-- Change <h1> and <p> -->
            <h1>Dagopgørelse</h1>

            <p>Lav en dagopgørelse i C1st.</p>
        </header>

        <main>
            <div class="guide-carousel">
                <button class="carousel-button previous">‹</button>

                <div class="carousel-content">
                    <div class="carousel-image">
                        <img
                            id="guide-image"
                            src=""
                            alt=""
                        >
                    </div>

                    <div class="carousel-description">
                        <div class="step-number">
                            Trin <span id="current-step">1</span>
                            af
                            <span id="total-steps">3</span>
                        </div>

                        <h2 id="guide-title">Gå til Kasse</h2>

                        <p id="guide-description">
                            Gå til Kasse og scan/vælg den vare, som kunden vil købe.
                        </p>
                    </div>
                </div>

                <button class="carousel-button next">›</button>
            </div>

            <div class="carousel-dots" id="carousel-dots"></div>
        </main>

        <!-- Only change the guideSteps array to modify the guide steps -->
        <script>
            window.guideSteps = [
                {
                    image: "../images/lavSalg/step-1.png",
                    title: 'Gå til Kasse',
                    description: '',
                },
                {
                    image: "../images/dagopgorelse/step-2.png",
                    title: 'Gå til dagopgørelse',
                    description: 'Tryk på "Dagopgørelse" i menuen.',
                },
                {
                    image: "../images/dagopgorelse/step-3.png",
                    title: 'Lav dagopgørelse',
                    description: 'Tryk på den blå "Ny dagopgørelse".',
                },
                {
                    image: "../images/dagopgorelse/step-4.png",
                    title: 'Udfyld optalt kontanter',
                    description:
                        'Indtast det optalte kontantbeløb, der kan gøres brug af "Kontantoptæller" hvis nødvendigt. Hvis det er blevet brugt penge til indkøb så skriv mængden i "Dagens kontantudlæg".',
                },
            ];
        </script>

        <script src="../js/carousel.js"></script>
    </body>
</html>
