<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Change <title> -->
        <title>Lagermodtagelse - C1st Guide</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="../images/favicon.png"
        >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header class="site-header">
            <a href="../../Start Guide.html">← Tilbage til start</a>

            <!-- Change <h1> and <p> -->
            <h1>Lagermodtagelse</h1>

            <p>Lav en lagermodtagelse i C1st.</p>
        </header>

        <main>
            <div class="guide-carousel">
                <button class="carousel-button previous">‹</button>

                <div class="carousel-content">
                    <div class="carousel-image">
                        <img
                            id="guide-image"
                            src=""
                            alt=""
                        >
                    </div>

                    <div class="carousel-description">
                        <div class="step-number">
                            Trin <span id="current-step">1</span>
                            af
                            <span id="total-steps">3</span>
                        </div>

                        <h2 id="guide-title">Gå til Vare</h2>

                        <p id="guide-description">Gå til Vare for at oprette en ny vare.</p>
                    </div>
                </div>

                <button class="carousel-button next">›</button>
            </div>

            <div class="carousel-dots" id="carousel-dots"></div>
        </main>

        <!-- Only change the guideSteps array to modify the guide steps -->
        <script>
            window.guideSteps = [
                {
                    image: "../images/opretVare/step-1.png",
                    title: 'Gå til Vare',
                    description: '',
                },
                {
                    image: "../images/lagermodtagelse/step-2.png",
                    title: 'Gå til Lager',
                    description: 'Tryk på "Lager" i menuen.',
                },
                {
                    image: "../images/lagermodtagelse/step-3.png",
                    title: 'Start ny lagermodtagelse',
                    description: 'Tryk på den blå "Ny lagermodtagelse".',
                },
                {
                    image: "../images/lagermodtagelse/step-4.png",
                    title: 'Tilføj vare',
                    description: 'Tilføj eller scan vare til lagermodtagelsen.',
                },
                {
                    image: "../images/lagermodtagelse/step-5.png",
                    title: 'Tjek antal og kostpris',
                    description: 'Tjek antal og kostpris for den tilføjede vare.',
                },
                {
                    image: "../images/lagermodtagelse/step-6.png",
                    title: 'Bekræft lagermodtagelse',
                    description: 'Tryk på den blå "Bekræft", når alle varer er tilføjet.',
                },
                {
                    image: "../images/lagermodtagelse/step-7.png",
                    title: 'Indtast fakturainformation',
                    description: 'Indtast fakturainformation for lagermodtagelsen.',
                },
                {
                    image: "../images/lagermodtagelse/step-8.png",
                    title: 'E-conomic',
                    description:
                        'Tilføj lagermodtagelsen til e-conomic. Leverandøren er "Labtech Data A/S" hvis modtagelsen er intern.',
                },
            ];
        </script>

        <script src="../js/carousel.js"></script>
    </body>
</html>
