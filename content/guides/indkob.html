<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Change <title> -->
        <title>Indkøb - C1st Guide</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="../images/favicon.png"
        >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header class="site-header">
            <a href="../../Start Guide.html">← Tilbage til start</a>

            <!-- Change <h1> and <p> -->
            <h1>Indkøb</h1>

            <p>Lav et indkøb i C1st.</p>
        </header>

        <main>
            <div class="guide-carousel">
                <button class="carousel-button previous">‹</button>

                <div class="carousel-content">
                    <div class="carousel-image">
                        <img
                            id="guide-image"
                            src=""
                            alt=""
                        >
                    </div>

                    <div class="carousel-description">
                        <div class="step-number">
                            Trin <span id="current-step"></span>
                            af
                            <span id="total-steps"></span>
                        </div>

                        <h2 id="guide-title"></h2>

                        <p id="guide-description"></p>
                    </div>
                </div>

                <button class="carousel-button next">›</button>
            </div>

            <div class="carousel-dots" id="carousel-dots"></div>
        </main>

        <!-- Only change the guideSteps array to modify the guide steps -->
        <script>
            window.guideSteps = [
                {
                    image: "../images/opretVare/step-1.png",
                    title: 'Gå til Varer',
                    description: '',
                },
                {
                    image: "../images/indkob/step-2.png",
                    title: 'Gå til Indkøb',
                    description: 'Tryk på "Indkøb" i menuen.',
                },
                {
                    image: "../images/indkob/step-3.png",
                    title: 'Gå til Igangværende indkøb',
                    description:
                        'Tryk på "Igangværende indkøb" i sub-menuen. Derefter tryk på det indkøb, du vil færdiggøre.',
                },
                {
                    image: "../images/indkob/step-4.png",
                    title: 'Opret lagermodtagelse',
                    description: 'Tryk på den blå "Opret som lagermodtagelse".',
                },
                {
                    image: "../images/lagermodtagelse/step-5.png",
                    title: 'Tjek antal og kostpris',
                    description:
                        'Tjek antal og kostpris for den tilføjede vare. Hvis en vare ikke findes på fakturaen så fjern den.',
                },
                {
                    image: "../images/lagermodtagelse/step-6.png",
                    title: 'Bekræft lagermodtagelse',
                    description: 'Tryk på den blå "Bekræft", når alle varer er tjekket igennem.',
                },
                {
                    image: "../images/lagermodtagelse/step-7.png",
                    title: 'Indtast fakturainformation',
                    description: 'Indtast fakturainformation for indkøbet.',
                },
                {
                    image: "../images/lagermodtagelse/step-8.png",
                    title: 'E-conomic',
                    description:
                        'Tilføj indkøbet til e-conomic. Leverandøren er "Labtech Data A/S" hvis modtagelsen er intern.',
                },
            ];
        </script>

        <script src="../js/carousel.js"></script>
    </body>
</html>
