name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # Remove UTF-8 BOMs that prevent Jekyll
      # from recognizing front matter
      - name: Remove UTF-8 BOM from HTML files
        run: |
          python3 <<'PY'
          from pathlib import Path

          for file in Path(".").rglob("*.html"):
              data = file.read_bytes()

              if data.startswith(b"\xef\xbb\xbf"):
                  file.write_bytes(data[3:])
                  print(f"Removed BOM: {file}")
              else:
                  print(f"No BOM: {file}")
          PY


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site


      # Optional safety check:
      # Make sure Jekyll actually processed Liquid.
      - name: Check for unprocessed Liquid
        run: |
          if grep -R "{{.*relative_url.*}}" ./_site --include="*.html"; then
            echo "ERROR: Found unprocessed Jekyll Liquid!"
            exit 1
          fi

          echo "All Liquid URLs were processed successfully."


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
